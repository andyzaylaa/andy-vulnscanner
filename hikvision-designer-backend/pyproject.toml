[project]
name = "hikvision-system-designer"
version = "1.0.0"
description = "AI-Powered Security & Building Systems Design Tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "httpx>=0.25.0",
    "openai>=1.6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
